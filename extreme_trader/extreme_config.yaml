# EXTREME LEVERAGE STRATEGY - Works with any strategy
data_mode: "live"
testing_mode: "paper"

symbol: "BTC/USDT"
strategy: "extreme_scalp"

leverage: 100
capital: 1000
target_profit_per_day: 500

entry_rules:
  rsi_threshold: 20
  volume_multiplier: 2

exit_rules:
  take_profit_pct: 1.0
  stop_loss_pct: 0.5
  max_hold_seconds: 30

max_concurrent_trades: 1
max_daily_loss: -500
check_interval_seconds: 1
