# $100 test — 30 min window, most volatile, max signals

exchange:
  name: binance
  testnet: true

trading:
  symbol: SOL/USDT      # Most volatile major pair on testnet
  timeframe: 1m
  poll_interval: 0.7    # Max safe speed
  capital: 100
  risk_per_trade: 0.02
  max_daily_loss: 0.10
  max_open_trades: 1
  run_duration_minutes: 30

strategy:
  active: ema_crossover

ema_crossover:
  ema_fast: 3            # Ultra-short — crosses every few candles
  ema_slow: 7
  rsi_period: 14
  rsi_oversold: 0        # No RSI filter
  rsi_overbought: 100
  atr_period: 14
  atr_multiplier: 1.0
  take_profit_ratio: 1.5

mean_reversion:
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  atr_period: 14
  atr_multiplier: 1.5
  take_profit_ratio: 1.5

grid:
  upper_price: 0
  lower_price: 0
  grid_levels: 10
  grid_size_pct: 0.01
